packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  msgpackr-extract: false
  node-pty: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.9'
  - '@expo/metro-config@57.0.6'
  - '@expo/prebuild-config@57.0.8'
  - expo-asset@57.0.6
  - expo-constants@57.0.6
  - expo-modules-autolinking@57.0.8
  - expo-modules-core@57.0.6
  - expo@57.0.7
overrides:
  shell-quote: 1.11.0
  '@xmldom/xmldom': 0.8.15
  nanoid: 3.3.20
  js-yaml: 4.3.2
  source-map-js: 1.2.2
  compression: 1.8.2
  browserslist: 4.28.7
